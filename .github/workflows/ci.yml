name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Powers the DB-backed integration suites (vitest globalSetup +
      # prisma db push + seed). Backend features stay unset here so CI
      # exercises the same defaults a fresh deploy sees.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/workpulse_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint backend + frontend
        run: npm run lint

      - name: Unit + DB-backed integration tests
        run: npm test

      - name: Production build (frontend)
        run: npm run build -w frontend